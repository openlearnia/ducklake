# Publish a compatibility-locked linux_amd64 DuckDB + DuckLake/Quack MV bundle.
# Parquet-only — does not set DUCKLAKE_VORTEX_EXTENSION_DIR / does not call DuckDB CDN deploy.
#
# Grain / VPS download (public, no token) — Release assets preferred:
#   https://github.com/openlearnia/ducklake/releases/download/grain-ext-<duckdb-version>-<sha>/ducklake-<duckdb-version>-linux_amd64.duckdb_extension
# Actions artifact (auth required even on public repos):
#   gh run download <run_id> -n ducklake-linux_amd64-<duckdb-version> -R openlearnia/ducklake
#
# Spec: docs/grain-ducklake-extension-ci-requirements.md (in ducklake-vortex)
# Runners: Blacksmith drop-in (blacksmith-4vcpu-ubuntu-2404) — org app must be installed.

name: Grain Extension Publish

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create GitHub Release grain-ext-<duckdb-version>-<shortsha>
        type: boolean
        default: true
  push:
    branches:
      - vortex-integration
      - ducklake-2-preview-port
    paths:
      - "src/**"
      - "test/sql/materialized_view/**"
      - "test/sql/procedures/**"
      - "duckdb"
      - "extension_config.cmake"
      - ".github/duckdb-version"
      - ".github/scripts/validate_paired_release.py"
      - ".github/workflows/GrainExtensionPublish.yml"
      - ".github/workflows/_grain_extension_distribution.yml"

concurrency:
  group: grain-ext-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  get-duckdb-version:
    name: Get DuckDB version
    # Dont change the run to 4vcpu. it burns the free limits and doesnt work much faster than 2vpcu
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      duckdb_version: ${{ steps.version.outputs.duckdb_version }}
      duckdb_ref: ${{ steps.version.outputs.duckdb_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - id: version
        run: |
          set -euo pipefail
          duckdb_ref="$(git ls-tree HEAD duckdb | awk '{print $3}')"
          if [[ ! "$duckdb_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "duckdb gitlink is not a full lowercase commit SHA: $duckdb_ref" >&2
            exit 1
          fi
          echo "duckdb_version=$(cat .github/duckdb-version)" >> "$GITHUB_OUTPUT"
          echo "duckdb_ref=$duckdb_ref" >> "$GITHUB_OUTPUT"

  build-linux-amd64:
    name: Build linux_amd64 ducklake
    needs: get-duckdb-version
    uses: ./.github/workflows/_grain_extension_distribution.yml
    with:
      # The extension compiles against the exact DuckDB gitlink recorded by this
      # parent commit, not a separately maintained release pin.
      duckdb_version: ${{ needs.get-duckdb-version.outputs.duckdb_ref }}
      override_git_describe: ${{ needs.get-duckdb-version.outputs.duckdb_version }}
      override_duckdb_repository: https://github.com/openlearnia/duckdb.git
      ci_tools_version: v1.5-variegata
      # The DuckDB 2 preview bundle needs the current libpq Meson port; the
      # older vcpkg pin still builds PostgreSQL 16 through the broken Makefile
      # path on Blacksmith's release triplet.
      vcpkg_commit: 127402f1c75bb3d5ff6bce04b285faa4930a5aca
      extension_name: ducklake
      # Focused: Grain lab VPS only. Keep arm64/osx/windows/wasm out of this oven.
      exclude_archs: >-
        linux_arm64;linux_amd64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
      skip_tests: false
      build_duckdb_shell: true
      upload_duckdb_binaries: true
      upload_all_extensions: true
      # libpq builds PostgreSQL's parser sources from the vendored source tree.
      # The Blacksmith image must provide flex/bison before vcpkg configures it.
      extra_toolchains: parser_tools
      test_config: '{"test_env_variables":{"ENABLE_POSTGRES_SCANNER":"1","ENABLE_GRAIN_BUNDLE_EXTENSIONS":"1","ENABLE_QUACK":"1"}}'
      reduced_ci_mode: disabled

  publish:
    name: Publish Grain artifact
    needs: [get-duckdb-version, build-linux-amd64]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: ducklake-${{ needs.get-duckdb-version.outputs.duckdb_ref }}-extension-linux_amd64
          path: dist/

      - name: Download pinned DuckDB runtime
        uses: actions/download-artifact@v4
        with:
          name: duckdb-${{ needs.get-duckdb-version.outputs.duckdb_ref }}-runtime-linux_amd64
          path: duckdb-runtime/

      - name: Checkout extension repository Worker
        uses: actions/checkout@v4
        with:
          path: repository-source
          sparse-checkout: extension-repository
          sparse-checkout-cone-mode: true

      - name: Stage Grain package
        id: stage
        env:
          DUCKDB_VERSION: ${{ needs.get-duckdb-version.outputs.duckdb_version }}
          DUCKDB_REF: ${{ needs.get-duckdb-version.outputs.duckdb_ref }}
          GIT_SHA: ${{ github.sha }}
          GIT_REF_NAME: ${{ github.ref_name }}
          GIT_REPO: ${{ github.repository }}
          DUCKDB_EXTENSION_SIGNING_PK: ${{ secrets.DUCKDB_EXTENSION_SIGNING_PK }}
        run: |
          set -euo pipefail
          mkdir -p grain-pkg
          EXT=$(find dist -type f -name 'ducklake.duckdb_extension' | head -n1)
          if [[ -z "$EXT" ]]; then
            echo "ducklake.duckdb_extension not found under dist/" >&2
            find dist -type f | head -50 >&2
            exit 1
          fi
          cp "$EXT" grain-pkg/ducklake.duckdb_extension
          cp "$EXT" "grain-pkg/ducklake-${DUCKDB_VERSION}-linux_amd64.duckdb_extension"
          for name in httpfs postgres_scanner quack; do
            extra=$(find dist -type f -name "${name}.duckdb_extension" | head -n1 || true)
            if [[ -z "$extra" ]]; then
              echo "Missing paired ${name} extension" >&2
              find dist -type f | sort >&2
              exit 1
            fi
            cp "$extra" "grain-pkg/${name}.duckdb_extension"
            cp "$extra" "grain-pkg/${name}-${DUCKDB_VERSION}-linux_amd64.duckdb_extension"
          done

          : "${DUCKDB_EXTENSION_SIGNING_PK:?DUCKDB_EXTENSION_SIGNING_PK secret is required}"
          SIGNING_KEY_FILE="$(mktemp)"
          SIGNING_PUBLIC_KEY_FILE="repository-source/extension-repository/openlearnia-extension-signing.pub"
          SIGNING_WORK_DIR="$(mktemp -d)"
          cleanup_signing() {
            rm -f "$SIGNING_KEY_FILE"
            rm -rf "$SIGNING_WORK_DIR"
          }
          trap cleanup_signing EXIT
          printf '%s\n' "$DUCKDB_EXTENSION_SIGNING_PK" > "$SIGNING_KEY_FILE"
          test -f "$SIGNING_PUBLIC_KEY_FILE"

          extension_hash() {
            local input="$1"
            local hash_concats="$SIGNING_WORK_DIR/hash_concats"
            local split_prefix="$SIGNING_WORK_DIR/chunk_"
            : > "$hash_concats"
            rm -f "$split_prefix"*
            split -b 1M "$input" "$split_prefix"
            for chunk in "$split_prefix"*; do
              openssl dgst -binary -sha256 "$chunk" >> "$hash_concats"
            done
            openssl dgst -binary -sha256 "$hash_concats"
          }

          sign_extension() {
            local name="$1"
            local extension="grain-pkg/${name}-${DUCKDB_VERSION}-linux_amd64.duckdb_extension"
            local unsigned="$SIGNING_WORK_DIR/${name}.unsigned"
            local hash="$SIGNING_WORK_DIR/${name}.hash"
            local signature="$SIGNING_WORK_DIR/${name}.signature"
            local signed="$SIGNING_WORK_DIR/${name}.signed"
            cp "$extension" "$unsigned"
            test "$(stat -c%s "$unsigned")" -gt 256
            truncate -s -256 "$unsigned"
            extension_hash "$unsigned" > "$hash"
            openssl pkeyutl -sign -in "$hash" -inkey "$SIGNING_KEY_FILE" \
              -pkeyopt digest:sha256 -out "$signature"
            test "$(stat -c%s "$signature")" -eq 256
            openssl pkeyutl -verify -pubin -inkey "$SIGNING_PUBLIC_KEY_FILE" \
              -sigfile "$signature" -in "$hash" -pkeyopt digest:sha256
            cat "$unsigned" "$signature" > "$signed"
            mv "$signed" "$extension"
            cp "$extension" "grain-pkg/${name}.duckdb_extension"
            echo "signed extension: $name"
          }

          for name in ducklake httpfs postgres_scanner quack; do
            sign_extension "$name"
          done

          test -f duckdb-runtime/bin/duckdb
          test -f duckdb-runtime/lib/libduckdb.so
          test -f duckdb-runtime/include/duckdb.h
          test -f duckdb-runtime/VERSION
          RUNTIME_VERSION="$(tr -d '\r\n' < duckdb-runtime/VERSION)"
          if [[ "$RUNTIME_VERSION" != "$DUCKDB_VERSION" ]]; then
            echo "Paired runtime VERSION is $RUNTIME_VERSION, expected $DUCKDB_VERSION" >&2
            exit 1
          fi
          chmod +x duckdb-runtime/bin/duckdb
          SHORT_SHA="${GIT_SHA::7}"
          SHORT_DUCKDB_REF="${DUCKDB_REF::10}"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          DUCKDB_ARCHIVE="duckdb-${DUCKDB_VERSION}-${SHORT_DUCKDB_REF}-linux_amd64.tar.gz"
          tar -C duckdb-runtime -czf "grain-pkg/${DUCKDB_ARCHIVE}" bin lib include VERSION
          export BUILT_AT DUCKDB_ARCHIVE RUNTIME_VERSION
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          package = Path("grain-pkg")
          asset_names = [
              f"{name}-{os.environ['DUCKDB_VERSION']}-linux_amd64.duckdb_extension"
              for name in ("ducklake", "httpfs", "postgres_scanner", "quack")
          ] + [os.environ["DUCKDB_ARCHIVE"]]
          checksums = {
              name: hashlib.sha256((package / name).read_bytes()).hexdigest()
              for name in asset_names
          }
          build_info = {
              "bundle": "duckdb-ducklake-materialized-views",
              "duckdb_version": os.environ["DUCKDB_VERSION"],
              "runtime_version": os.environ["RUNTIME_VERSION"],
              "duckdb_repository": "openlearnia/duckdb",
              "duckdb_ref": os.environ["DUCKDB_REF"],
              "ducklake_repository": os.environ["GIT_REPO"],
              "ducklake_ref": os.environ["GIT_SHA"],
              "git_ref": os.environ["GIT_REF_NAME"],
              "platform": "linux_amd64",
              "built_at": os.environ["BUILT_AT"],
              "signed": True,
              "signing_public_key": "openlearnia-extension-signing.pub",
              "features": [
                  "materialized_views",
                  "delta_refresh",
                  "derived_avg",
                  "conditional_min_max",
                  "join_incremental",
                  "staleness",
              ],
              "vortex_bundled": False,
              "sha256": checksums,
          }
          (package / "build-info.json").write_text(json.dumps(build_info, indent=2) + "\n")
          (package / "SHA256SUMS").write_text(
              "".join(f"{digest}  {name}\n" for name, digest in checksums.items())
          )
          manifest = {
              "schema_version": 1,
              "generated_at": os.environ["BUILT_AT"],
              "latest": {
                  "duckdb_version": os.environ["DUCKDB_VERSION"],
                  "duckdb_ref": os.environ["DUCKDB_REF"],
                  "ducklake_ref": os.environ["GIT_SHA"],
                  "platform": "linux_amd64",
                  "signed": True,
                  "signing_public_key": "openlearnia-extension-signing.pub",
                  "repository_prefix": f"{os.environ['DUCKDB_VERSION']}/linux_amd64",
                  "runtime": {
                      "file": os.environ["DUCKDB_ARCHIVE"],
                      "sha256": checksums[os.environ["DUCKDB_ARCHIVE"]],
                  },
                  "extensions": {
                      name: {
                          "file": f"{name}.duckdb_extension",
                          "gzip_file": f"{name}.duckdb_extension.gz",
                          "sha256": checksums[
                              f"{name}-{os.environ['DUCKDB_VERSION']}-linux_amd64.duckdb_extension"
                          ],
                      }
                      for name in ("ducklake", "httpfs", "postgres_scanner", "quack")
                  },
              },
          }
          (package / "artifacts.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          ls -lh grain-pkg/
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_tag=grain-ext-${DUCKDB_VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          {
            echo "### Grain DuckLake extension"
            echo ""
            echo "- Artifact: \`ducklake-linux_amd64-${DUCKDB_VERSION}\`"
            echo "- Platform: \`linux_amd64\`"
            echo "- DuckDB: \`${DUCKDB_VERSION}\`"
            echo "- DuckDB commit: \`${DUCKDB_REF}\`"
            echo "- SHA: \`${GIT_SHA}\`"
            echo "- Vortex bundled: false"
            echo ""
            echo '```json'
            cat grain-pkg/build-info.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Grain Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ducklake-linux_amd64-${{ needs.get-duckdb-version.outputs.duckdb_version }}
          path: grain-pkg/
          retention-days: 90
          if-no-files-found: error

      - name: Publish fork-matched extensions to R2 repository
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DUCKDB_VERSION: ${{ needs.get-duckdb-version.outputs.duckdb_version }}
          EXTENSION_REPOSITORY_URL: http://openlearnia-duckdb-extension-repository.defaultcms.workers.dev
        run: |
          set -euo pipefail
          : "${CF_API_TOKEN:?CF_API_TOKEN is required}"
          : "${CF_ACCOUNT_ID:?CF_ACCOUNT_ID is required}"
          export CLOUDFLARE_API_TOKEN="$CF_API_TOKEN"
          export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID"
          npx --yes wrangler@4.76.0 deploy --config repository-source/extension-repository/wrangler.jsonc
          npx --yes wrangler@4.76.0 r2 object delete \
            "openlearnia-duckdb-extensions/artifacts.json" --remote || true
          repo_dir="r2-extension-publish"
          mkdir -p "$repo_dir"
          cp grain-pkg/artifacts.json "$repo_dir/artifacts.json"
          npx --yes wrangler@4.76.0 r2 object put \
            "openlearnia-duckdb-extensions/_meta/artifacts.json" \
            --file "$repo_dir/artifacts.json" --remote
          curl --fail --silent --show-error \
            "$EXTENSION_REPOSITORY_URL/artifacts.json" | python3 -m json.tool >/dev/null
          for name in ducklake httpfs postgres_scanner quack; do
            source="grain-pkg/${name}-${DUCKDB_VERSION}-linux_amd64.duckdb_extension"
            plain="$repo_dir/${name}.duckdb_extension"
            compressed="$repo_dir/${name}.duckdb_extension.gz"
            cp "$source" "$plain"
            gzip -1 -c "$plain" > "$compressed"
            for suffix in duckdb_extension duckdb_extension.gz; do
              key="openlearnia-duckdb-extensions/${DUCKDB_VERSION}/linux_amd64/${name}.${suffix}"
              file="$repo_dir/${name}.${suffix}"
              npx --yes wrangler@4.76.0 r2 object put "$key" --file "$file" --remote
            done
            curl --fail --silent --show-error --head \
              "$EXTENSION_REPOSITORY_URL/${DUCKDB_VERSION}/linux_amd64/${name}.duckdb_extension"
          done

      - name: Create GitHub Release
        # Public VPS bootstrap needs Release assets (Actions artifacts require auth).
        # Mint on every release-producing branch push, and on dispatch when create_release=true.
        # ducklake-2-preview-port is a supported deployment source: its manifest is
        # published to R2, so the matching runtime tarball must be cut on GitHub too.
        if: >-
          (github.event_name == 'push' && (github.ref == 'refs/heads/vortex-integration' || github.ref == 'refs/heads/ducklake-2-preview-port'))
          || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stage.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Grain DuckLake ${{ needs.get-duckdb-version.outputs.duckdb_version }} (${{ steps.stage.outputs.short_sha }})
          body: |
            Compatibility-locked linux_amd64 DuckDB runtime and DuckLake extension with materialized views.

            - DuckDB ABI: `${{ needs.get-duckdb-version.outputs.duckdb_version }}`
            - DuckDB commit: `${{ needs.get-duckdb-version.outputs.duckdb_ref }}`
            - Commit: `${{ github.sha }}`
            - Ref: `${{ github.ref_name }}`
            - Features: materialized_views, delta_refresh, join_incremental, staleness
            - Vortex: not bundled
            - Paired extensions: httpfs, postgres_scanner, quack

            Grain install:
            ```bash
            gh release download ${{ steps.stage.outputs.release_tag }} -R ${{ github.repository }} \
              -p 'duckdb-*-linux_amd64.tar.gz' -p 'ducklake-*-linux_amd64.duckdb_extension' \
              -p build-info.json -p SHA256SUMS
            # or
            gh run download -n ducklake-linux_amd64-${{ needs.get-duckdb-version.outputs.duckdb_version }} -R ${{ github.repository }}
            ```
            Then set `GRAIN_DUCKLAKE_EXTENSION_PATH=/opt/grain/extensions/ducklake.duckdb_extension`.
          files: |
            grain-pkg/*-${{ needs.get-duckdb-version.outputs.duckdb_version }}-linux_amd64.duckdb_extension
            grain-pkg/duckdb-*-linux_amd64.tar.gz
            grain-pkg/build-info.json
            grain-pkg/artifacts.json
            grain-pkg/SHA256SUMS
          fail_on_unmatched_files: true
